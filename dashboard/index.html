<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GUESSNUM Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f5f7;
      color: #222;
      padding: 30px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      margin-bottom: 6px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .latest {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .result {
      font-size: 32px;
      font-weight: bold;
      color: #2e9d58;
      margin: 10px 0;
    }

    .answer {
      font-size: 30px;
      letter-spacing: 8px;
      font-weight: bold;
      margin-top: 10px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .stat-box {
      background: #f8f8f8;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-box h3 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .stat-box p {
      color: #777;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      padding: 14px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      color: #666;
    }

    .win {
      color: #2e9d58;
      font-weight: bold;
    }

    .lose {
      color: #d84a4a;
      font-weight: bold;
    }

    .guess-row {
      display: flex;
      gap: 8px;
      margin: 10px 0;
      align-items: center;
    }

    .digit {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: bold;
      color: white;
    }

    .green {
      background: #4caf50;
    }

    .yellow {
      background: #d6ad21;
    }

    .red {
      background: #d9534f;
    }

    .game-detail {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    button {
      background: #222;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    /* ---- เพิ่ม: สถานะ MQTT + หัวการ์ด History ---- */
    #mqttStatus {
      font-size: 13px;
      margin-left: 8px;
      color: #d6ad21;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @media (max-width: 700px) {
      .latest,
      .stats {
        grid-template-columns: 1fr;
      }

      body {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>GUESSNUM</h1>
  <p class="subtitle">
    Physical Number Guessing Game Dashboard
    <span id="mqttStatus">● connecting...</span>
  </p>

  <!-- Latest Game -->
  <div class="card">

    <h2>Latest Game</h2>

    <div class="latest">

      <div>
        <p>Result</p>
        <div class="result" id="latestResult">-</div>

        <p>Attempts Used</p>
        <h3 id="latestAttempts">-</h3>
      </div>

      <div>
        <p>Correct Answer</p>
        <div class="answer" id="latestAnswer">-----</div>
      </div>

    </div>

  </div>


  <!-- Statistics -->
  <div class="card">

    <h2>Game Statistics</h2>

    <div class="stats">

      <div class="stat-box">
        <h3 id="totalGames">0</h3>
        <p>Games Played</p>
      </div>

      <div class="stat-box">
        <h3 id="wins">0</h3>
        <p>Wins</p>
      </div>

      <div class="stat-box">
        <h3 id="losses">0</h3>
        <p>Losses</p>
      </div>

      <div class="stat-box">
        <h3 id="winRate">0%</h3>
        <p>Win Rate</p>
      </div>

    </div>

  </div>


  <!-- History -->
  <div class="card">

    <div class="card-head">
      <h2>Game History</h2>
      <button onclick="clearHistory()">Clear</button>
    </div>

    <table>

      <thead>
        <tr>
          <th>Game</th>
          <th>Result</th>
          <th>Attempts</th>
          <th>Answer</th>
          <th>Detail</th>
        </tr>
      </thead>

      <tbody id="historyTable">
      </tbody>

    </table>


    <!-- Game Detail -->
    <div id="gameDetail" class="game-detail">

      <h3>Game Detail</h3>

      <p>
        Answer:
        <strong id="detailAnswer"></strong>
      </p>

      <div id="guessHistory"></div>

    </div>

  </div>

</div>


<!-- MQTT over WebSocket -->
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>

<script>

// ------------------------------
// MQTT Settings (ต้องตรงกับ TOPIC_BASE ในโค้ด Arduino)
// ------------------------------

const MQTT_URL   = "wss://mqtt-dashboard.com:8884/mqtt";
const TOPIC_GAME = "r2n/game";

const STORAGE_KEY = "numdle_games";
const SEEN_KEY    = "numdle_seen";


// ------------------------------
// Load / Save (เก็บประวัติไว้ในเบราว์เซอร์)
// ------------------------------

function loadJSON(key) {
  try { return JSON.parse(localStorage.getItem(key)) || []; }
  catch (e) { return []; }
}

function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); }
  catch (e) {}
}

let games = loadJSON(STORAGE_KEY);
let seen  = loadJSON(SEEN_KEY);


// ------------------------------
// Render Latest Game
// ------------------------------

function renderLatest() {

  const g = games[0];
  const resultEl = document.getElementById("latestResult");

  if (!g) {
    resultEl.textContent = "-";
    document.getElementById("latestAttempts").textContent = "-";
    document.getElementById("latestAnswer").textContent = "-----";
    return;
  }

  resultEl.textContent = g.result;
  resultEl.style.color = g.result === "WIN" ? "#2e9d58" : "#d84a4a";

  document.getElementById("latestAttempts").textContent =
    `${g.attempts} / ${g.maxAttempts || 5}`;

  document.getElementById("latestAnswer").textContent = g.answer;

}


// ------------------------------
// Render History
// ------------------------------

const table = document.getElementById("historyTable");

function renderHistory() {

  table.innerHTML = "";

  games.forEach(game => {

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>#${game.id}</td>

      <td class="${game.result === "WIN" ? "win" : "lose"}">
        ${game.result}
      </td>

      <td>${game.attempts} / ${game.maxAttempts || 5}</td>

      <td>${game.answer}</td>

      <td>
        <button onclick="showGame(${game.id})">
          View
        </button>
      </td>
    `;

    table.appendChild(row);

  });

}


// ------------------------------
// Show Game Detail
// ------------------------------

function showGame(id) {

  const game = games.find(g => g.id === id);

  document.getElementById("gameDetail").style.display = "block";

  document.getElementById("detailAnswer").textContent =
    game.answer;

  const container =
    document.getElementById("guessHistory");

  container.innerHTML = "";

  game.guesses.forEach((guess, index) => {

    const row = document.createElement("div");

    row.className = "guess-row";

    const label = document.createElement("span");

    label.textContent = `Guess ${index + 1}:`;

    row.appendChild(label);

    for(let i = 0; i < 5; i++) {

      const box = document.createElement("div");

      box.className =
        `digit ${guess.colors[i]}`;

      box.textContent =
        guess.number[i];

      row.appendChild(box);

    }

    container.appendChild(row);

  });

}


// ------------------------------
// Calculate Statistics
// ------------------------------

function updateStats(){

  const total = games.length;

  const wins =
    games.filter(g => g.result === "WIN").length;

  const losses =
    total - wins;

  const rate = total
    ? ((wins / total) * 100).toFixed(1)
    : "0";

  document.getElementById("totalGames")
    .textContent = total;

  document.getElementById("wins")
    .textContent = wins;

  document.getElementById("losses")
    .textContent = losses;

  document.getElementById("winRate")
    .textContent = rate + "%";

}

function renderAll() {
  renderLatest();
  renderHistory();
  updateStats();
}


// ------------------------------
// Add Game from Arduino
// ------------------------------

function addGame(data) {

  if (!data || !data.answer) return;

  // กันข้อมูลซ้ำ (retained message จะถูกส่งมาใหม่ทุกครั้งที่เปิดเว็บ)
  if (data.uid && seen.includes(data.uid)) return;

  const nextId = games.length
    ? Math.max(...games.map(g => g.id)) + 1
    : 1;

  games.unshift({
    id: nextId,
    uid: data.uid,
    result: data.result,
    attempts: data.attempts,
    maxAttempts: data.maxAttempts || 5,
    answer: data.answer,
    guesses: data.guesses || []
  });

  if (data.uid) {
    seen.push(data.uid);
    seen = seen.slice(-300);
    saveJSON(SEEN_KEY, seen);
  }

  saveJSON(STORAGE_KEY, games);
  renderAll();

}

function clearHistory() {

  if (!confirm("ลบประวัติการเล่นทั้งหมด?")) return;

  games = [];
  saveJSON(STORAGE_KEY, games);
  document.getElementById("gameDetail").style.display = "none";
  renderAll();

}


// ------------------------------
// MQTT Connection
// ------------------------------

const statusEl = document.getElementById("mqttStatus");

function setStatus(text, color) {
  statusEl.textContent = "● " + text;
  statusEl.style.color = color;
}

const client = mqtt.connect(MQTT_URL, {
  clientId: "numdle-web-" + Math.random().toString(16).slice(2, 8)
});

client.on("connect", () => {
  setStatus("online", "#2e9d58");
  client.subscribe(TOPIC_GAME, { qos: 1 });
});

client.on("reconnect", () => setStatus("reconnecting...", "#d6ad21"));
client.on("offline",   () => setStatus("offline", "#d84a4a"));
client.on("error", err => console.error("MQTT error:", err));

client.on("message", (topic, payload) => {
  try {
    addGame(JSON.parse(payload.toString()));
  } catch (e) {
    console.warn("Bad message:", payload.toString());
  }
});

renderAll();

</script>

</body>
</html>
